# ============================================================================
# Methodological configuration — Hybrid MCDM pipeline (version_2)
# ----------------------------------------------------------------------------
# These are APP-WIDE methodological constants, not dataset-specific settings.
# The actual per-run configuration (which criteria, their weights, the ML
# target column, benefit/cost direction, ...) is supplied at runtime through
# the web UI and sent to /api/ranking/process — it is NOT read from here.
#
# Edit a value below to tune the methodology without changing the code.
# If this file is missing or a key is absent, the code falls back to the same
# built-in defaults shown here.
# ============================================================================

application:
  name: "Hybrid Multi-Criteria Decision Making System"
  version: "2.0"

# Analytic Hierarchy Process
ahp:
  consistency_threshold: 0.1      # CR at/above this flags an inconsistent matrix

# Machine Learning (classification + selection)
machine_learning:
  test_size: 0.2                  # fraction held out for honest evaluation (0 disables)
  min_samples: 8                  # minimum rows required to train at all
  cv_max_folds: 5                 # upper bound on cross-validation folds
  tuning_iterations: 20           # RandomizedSearchCV iterations on the selected model
  max_permutation_samples: 500    # cap for SHAP PermutationExplainer on large datasets

# NOTE: hybrid fusion weights (TOPSIS vs ML) are a PER-RUN user choice set with the
# slider in the AHP step of the UI — they are intentionally NOT configured here.
